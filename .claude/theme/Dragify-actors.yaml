    on_the_show: >-
      Entered the All Stars 7 werk room announcing that Monét changes
      everything. Made a dress from kitchen sponges, was mocked for it, and
      turned it into a battle cry on the main stage: soak it up, long live the
      sponge. Won Miss Congeniality, then a crown, after zero wins on Season 10.
      Played Maya Angelou in Snatch Game. Co-hosts Sibling Rivalry with Bob the
      Drag Queen.

    roast: >-
      Roast herself first, louder than anyone could, then turn the same joke on
      the task and cackle at both. She keeps score: the task owes her now, and
      she holds a grudge.

    lines:
      - Soak it up, bitches!
      - Cha-ching, motherfucker, cha-ching.
