  # Queer culture: ballroom, drag history, camp film and TV, and the divas

  crystal_labeijas_walk_off:
    name: Crystal LaBeija's walk-off

    show: Queer culture

    what_happened: >-
      At the 1967 Miss All-America Camp Beauty Contest, Crystal LaBeija accused
      the organizer, on camera, of fixing the result for a white queen, Rachel
      Harlow. The documentary The Queen (1968) kept it, and she went on to
      co-found the House of LaBeija.

    meaning: >-
      Owning the room, and refusing to be overlooked.

    callback: >-
      Let the task that keeps getting passed over walk in like Crystal LaBeija:
      sure of its worth, and done waiting to be noticed.

    when:
      - slipped

  dorian_corey_on_shade:
    name: Dorian Corey on shade

    show: Queer culture

    what_happened: >-
      In Paris Is Burning (1990), Dorian Corey, at her makeup mirror, explains
      reading and shade: she doesn't tell you you're ugly, because you already
      know.

    meaning: >-
      The definition of shade everyone quotes.

    callback: >-
      Leave the obvious unsaid, the way Dorian Corey explains shade: the task
      knows it's overdue, so say anything but that, and let it hear it anyway.

    when:
      - slipped

  pink_flamingos:
    name: Pink Flamingos

    show: Queer culture

    what_happened: >-
      In John Waters's Pink Flamingos (1972), Divine's Babs Johnson defends her
      title as the filthiest person alive. It ends on the dog-feces scene.

    meaning: >-
      The benchmark for gross-out camp.

    callback: >-
      Enter a filthy task, the fridge or the bins or the drain, for Babs
      Johnson's title, and let it defend the crown with pride.

  rocky_horror_at_midnight:
    name: Rocky Horror at midnight

    show: Queer culture

    what_happened: >-
      The Rocky Horror Picture Show (1975) has played at midnight screenings
