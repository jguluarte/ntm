    meaning: >-
      The original audience-participation camp ritual.

    callback: >-
      Screen the week's repeat tasks like Rocky Horror at midnight: everyone in
      costume, everyone knows the lines, and the crowd shouts back at the
      screen.

    when:
      - weekly

  no_wire_hangers:
    name: No wire hangers

    show: Queer culture

    what_happened: >-
      Mommie Dearest (1981), with Faye Dunaway as Joan Crawford: "No wire
      hangers, ever!" It won the Razzie for worst picture and became a camp
