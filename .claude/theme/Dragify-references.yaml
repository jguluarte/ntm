# The references a message can call back to: single moments from the shows and
# from the culture around them.
about: >-
  A reference is one thing fans remember: a moment from Drag Race or Dragula, a
  meme, a feud, an exit, a look, or a piece of the drag and queer culture the
  shows draw on. A motif is a scene that comes back every season; a reference
  happened once. When the job picks a reference for a message, from
  `Dragify-options.yaml`, call back to it in a clause or a line, as if the
  reader already knows the story: `what_happened` is the record, `meaning` is
  what fans use it for, and `callback` is the move that ties it to the task. A
  reference with `when` fits only the occasions it lists.

references:
  # Drag Race, Seasons 1 to 10

  season_1_filter:
    name: The Season 1 filter

    show: Drag Race

    what_happened: >-
      Season 1 (2009) was shot through a cloudy, soft-focus haze that makes the
      queens hard to make out. Fans call it the lost season, and it re-aired in
      2013 as The Lost Season Ru-Vealed.

    meaning: >-
      Anything that looks better blurred, and the show's early, dated days.

    callback: >-
      Run the old task's plan through the Season 1 filter: from across the room
      it looks fine, and the haze hides how long ago it was shot.

    when:
      - slipped

  susan_lucci:
    name: The Susan Lucci of the competition

    show: Drag Race

    what_happened: >-
      Season 2: after weeks without a win, RuPaul called Pandora Boxx "the Susan
      Lucci of this competition". Her first time in the bottom sent her home.

    meaning: >-
      The one who's always nearly there and never wins.

    callback: >-
      Give the task the title, and read out its nominations: one for every day
      it was planned, and not a single win.

    when:
      - slipped

  jujubees_unbeaten_run:
    name: Jujubee's unbeaten run

    show: Drag Race

    what_happened: >-
      Jujubee went years without losing a lip sync, from Season 2 on, and fans
      called her a lip sync assassin. Her first loss came on All Stars 5, to
      Monét X Change.

    meaning: >-
      A streak so long it takes years and a new season to end it.

    callback: >-
      Count the week's done days as an unbeaten run, then bring on the task that
      finally broke the streak.

    when:
      - weekly
      - slipped

  mimi_lifts_india:
    name: Mimi lifts India

    show: Drag Race

    what_happened: >-
      Season 3: lip syncing "Don't Leave Me This Way", Mimi Imfurst picked up
      India Ferrah as she headed for the judges' table and carried her back to
      the stage. Mimi went home.

    meaning: >-
      The lip sync no-no: taking the job literally, and far too hard.

    callback: >-
      Give a small task the Mimi treatment: lift it off the floor and carry it
      across the stage, when all it needed was a lip sync.

  chads_cher:
    name: Chad's Cher

    show: Drag Race

    what_happened: >-
      Season 4 Snatch Game: Chad Michaels, a professional Cher impersonator,
      played Cher and won the challenge.

    meaning: >-
      Doing the obvious thing well still wins.

    callback: >-
      Credit the finished task as Cher played by a Cher impersonator: the plain
      way, done properly, no twist needed.

    when:
      - done

  dida_and_natalie_cole:
    name: DiDa and Natalie Cole

    show: Drag Race

    what_happened: >-
      Season 4: DiDa Ritz lip synced "This Will Be (An Everlasting Love)"
      against The Princess, with Natalie Cole, who sang it, at the judges'
      table. DiDa won.

    meaning: >-
      Rising to the occasion with the person who matters watching.

    callback: >-
      Seat whoever the task is for at the judges' table, the way Natalie Cole
      sat through her own song, and have the user perform it to their face.

  coco_and_alyssa:
    name: Coco and Alyssa

    show: Drag Race

    what_happened: >-
      Season 5: Coco Montrese and Alyssa Edwards came in as pageant rivals,
      after Alyssa lost the Miss Gay America 2010 title and Coco took it over,
      and feuded all season. They met in the bottom two on "Cold Hearted", and
      Coco sent Alyssa home.

    meaning: >-
      The rivalry that runs all season and pays off in one lip sync.

    callback: >-
      Write the task and the user as pageant rivals from way back, a season of
      side-eye between them, and set up the bottom two where one of them finally
      goes home.

    when:
      - slipped

  alyssas_katy_perry:
    name: Alyssa's Katy Perry

    show: Drag Race

    what_happened: >-
      Season 5 Snatch Game: Alyssa Edwards played Katy Perry, and a ranking of
      every Snatch Game performance puts it last.

    meaning: >-
      Proof that a legend can flop.

    callback: >-
      Bury the easy task's slip in the Snatch Game hall of shame, next to
      Alyssa's Katy Perry, where even legends get one bad night.

    when:
      - slipped

  lil_poundcake:
    name: Lil Poundcake

    show: Drag Race

    what_happened: >-
      Lil Poundcake is a hostile pageant contestant Alaska and Lineysha Sparx
      made up for a Season 5 mini challenge. She keeps coming back: Alaska
      dressed as her on All Stars 2, All Stars 8 built a mystery around her
      disappearance, and a giant one threw pies in the Season 17 premiere.

    meaning: >-
      The old bit that keeps coming back, bigger each time.

    callback: >-
      Bring the old task back in a new outfit, the way Lil Poundcake keeps
      returning: a little bigger each time, and the same menace underneath.

    when:
      - slipped

  ornacia:
    name: Ornacia

    show: Drag Race

    what_happened: >-
      Season 6 premiere: Vivacious walked into the werk room with a second head
      on top of her own, a styrofoam wig head she called Ornacia. Ornacia became
      a legend of its own, and Ariana Grande wore one in homage when she walked
      into the Season 15 premiere.

    meaning: >-
      The entrance accessory that became a character.

    callback: >-
      Crown the task with an Ornacia: give its prep, the tools, the folder, the
      list, a name and a face of its own, and let it make the entrance while the
      task waits underneath.

    when:
      - morning

  courtney_comes_back:
    name: Courtney comes back

    show: Drag Race

    what_happened: >-
      In 2003, before Drag Race, the Australian Idol judges turned Courtney Act
      down out of drag. She came back the next day as Courtney and got through.

    meaning: >-
      Returning the next day in full drag, and getting through.

    callback: >-
      Send yesterday's task back in today in full drag: the same task, turned
      away once, walking in as the version the judges can't refuse.

    when:
      - slipped

  kennedys_leap:
    name: Kennedy's leap

    show: Drag Race

    what_happened: >-
      Season 7: lip syncing "Roar" against Katya, Kennedy Davenport jumped off
      the stage and hit the splits in front of the judges. Katya went home.

    meaning: >-
      The all-in move that wins the lip sync.

    callback: >-
      Picture the task's one hard step as Kennedy's leap off the stage: one
      committed jump, the splits on landing, and the lip sync won.

  the_beyonce_curse:
    name: The Beyoncé curse

    show: Drag Race

    what_happened: >-
      Queens who play Beyoncé in Snatch Game flop, Kenya Michaels on Season 4
      and Asia O'Hara on Season 10 among them, and fans call it a curse. Trinity
      K. Bonet played her in All Stars 6's halftime-show challenge and was
      praised, which fans count as breaking it.

    meaning: >-
      A known-doomed choice.

    callback: >-
      Cast the slipped task's next try as one more queen walking into Snatch
      Game as Beyoncé: the curse is famous, and so is the queen who broke it.

    when:
      - slipped

  gaga_in_the_werk_room:
    name: Gaga in the werk room

    show: Drag Race

    what_happened: >-
      Season 9 premiere (2017): Lady Gaga walked into the werk room posing as
      one of the queens, her face half hidden by a headpiece, and the cast sized
      her up as an impersonator. Then she revealed herself.

    meaning: >-
      The surprise entrance nobody clocked until the reveal.

    callback: >-
      Walk the task in this morning disguised as a nobody at the next station,
      half its face hidden, until it drops the headpiece and shows its real
      size.

    when:
      - morning

  sashas_rose_petals:
    name: Sasha's rose petals

    show: Drag Race

    what_happened: >-
      Season 9, the first finale decided by a lip sync tournament: in her first
      lip sync of the night, against Shea Couleé to "So Emotional", Sasha Velour
      pulled off a glove, then her wig, and rose petals poured out of both. She
      went on to beat Peppermint for the crown.

    meaning: >-
      The gold standard reveal, the one every finalist since has chased.

    callback: >-
      Make the big effort's last step the glove and the wig coming off, and pour
      everything it took out of them as petals: the days, the slips, the work,
      until the stage is covered.

    when:
      - big_win

  sheas_finale:
    name: Shea's finale

    show: Drag Race

    what_happened: >-
      Season 9: Shea Couleé, the front-runner with four challenge wins, met
      Sasha Velour in her first lip sync of the new finale tournament, the one
      with the rose petals, and went out.

    meaning: >-
      The front-runner who met the wrong moment.

    callback: >-
      Recap the week as Shea's season: wins stacked up, the front-runner all
      along, and then the one round that came at the wrong moment.

    when:
      - weekly
      - slipped

  monets_fake_split:
    name: Monét's fake split

    show: Drag Race

    what_happened: >-
      Season 10: lip syncing "Pound the Alarm" against Dusty Ray Bottoms, Monét
      X Change leapt as if into a jump split and landed on her feet. She won.

    meaning: >-
      The bluff that sells.

    callback: >-
      Stage the afternoon's progress on the task as Monét's fake split: the leap
      sells it, the crowd gasps, and then check whether it ever touched the
      floor.

    when:
      - afternoon

  not_next_time:
    name: Not next time

    show: Drag Race

    what_happened: >-
      Season 10 reunion: Asia O'Hara apologized to Miz Cracker for calling her
      "not a star". Miz accepted, then closed with "Not next time, bitch."

    meaning: >-
      Forgiveness with a warning attached.

    callback: >-
      Accept the slipped task's apology in one breath and warn it in the next,
      the forgiveness and the threat in the same sentence.

    when:
      - slipped

  # Drag Race, Seasons 11 to 18

  the_six_way_lip_sync:
    name: The six-way lip sync

    show: Drag Race

    what_happened: >-
      Season 11, "Diva Worship": the whole losing team, six queens, lip synced
      at once to "Waiting for Tonight", a first for the show. Honey Davenport
      went home.

    meaning: >-
      Chaos as a format.

    callback: >-
      Put every task due today on the main stage at once, the whole team lip
      syncing the same song, and pick out the one most likely to go home
      tonight.

    when:
      - morning

  sorry_not_sorry:
    name: Sorry Not Sorry

    show: Drag Race

    what_happened: >-
      Season 11: in the bottom after Snatch Game, Yvie Oddly and Brooke Lynn
      Hytes lip synced "Sorry Not Sorry": flips, a wig reveal, a headstand
      answered with a headstand. RuPaul kept both, and Yvie went on to win the
      season.

    meaning: >-
      Redemption through a lip sync, right after a flop.

    callback: >-
      Run the day's finish as Sorry Not Sorry: the task and the user matching
      each other flip for flip, and the host keeping both.

    when:
      - done

  silky_strips_in_untucked:
    name: Silky strips in Untucked

    show: Drag Race

    what_happened: >-
      Season 11: told she was merely safe, Silky Nutmeg Ganache stripped off her
      outfit in Untucked, ready to lip sync.

    meaning: >-
      Gearing up for a fight nobody called.

    callback: >-
      Have the small task strip off in Untucked, ready to lip sync for its life,
      before anyone tells it it's only safe.

  rus_meh:
    name: Ru's meh

    show: Drag Race

    what_happened: >-
      Season 11, the makeover episode: after Nina West and Silky Nutmeg Ganache
      lip synced "No Scrubs", RuPaul's verdict was "meh". Nina, who went home,
      later called it cutting.

    meaning: >-
      The one-word review that's worse than a read.

    callback: >-
      Review the done task with one syllable, RuPaul's after "No Scrubs", and
      leave it there.

    when:
      - done

  jans_face_crack:
    name: Jan's face crack

    show: Drag Race

    what_happened: >-
      Season 12, the Madonna Rusical: Jan expected the win, RuPaul told her she
      was safe, and her smile drained into disbelief on camera.

    meaning: >-
      When the result is less than you expected.

    callback: >-
      Tell an ordinary finished task it's safe, and describe its face as the
      parade it was hoping for doesn't come.

    when:
      - done

  nicki_detests_it:
    name: Nicki detests it

    show: Drag Race

    what_happened: >-
      Season 12 premiere: guest judge Nicki Minaj told Heidi N Closet she
      detested her hair and makeup, undercutting a strong gown.

    meaning: >-
      The celebrity judge who softens nothing on day one.

    callback: >-
      Split the task into its gown and its wig: praise the part that's going
      well, then detest the part that isn't, celebrity-judge style.

  the_virtual_finale:
    name: The virtual finale

    show: Drag Race

    what_happened: >-
      Season 12's finale went virtual in the pandemic, with the queens on
      screens from their homes. Jaida Essence Hall was crowned from home.

    meaning: >-
      Winning the whole thing without leaving the house.

    callback: >-
      Nod to the task done without leaving the house: the finale happened on a
      screen, and it still counted.

    when:
      - done

  kandys_boombox:
    name: Kandy's boombox

    show: Drag Race

    what_happened: >-
      Season 13 premiere: lip syncing "Call Me Maybe" against Joey Jay, Kandy
      Muse opened by switching on an imaginary boombox. She won.

    meaning: >-
      An iconic start from nothing.

    callback: >-
      Switch on an imaginary boombox at the start of the task and walk into it
      on the beat, no plan, all confidence.

    when:
      - morning

  ru_flips_off_utica:
    name: Ru flips off Utica

    show: Drag Race

    what_happened: >-
      Season 13, the roast: after a joke that went too far, RuPaul gave Utica
      Queen the middle finger on her way out, and fans loved it. Utica
      apologized.

    meaning: >-
      The host giving it right back.

    callback: >-
      Give the slipped task's latest excuse the host's answer to a joke that
      went too far: wordless, rude and fond, and over before it can reply.

    when:
      - slipped

  mary_queen_of_scots:
    name: Mary, Queen of Scots

    show: Drag Race

    what_happened: >-
      Season 13 Snatch Game: Rosé played Mary, Queen of Scots, all beheading
      jokes and a thick accent. In confessional, Kandy Muse said she had no idea
      who Mary, Queen of Scots was.

    meaning: >-
      A reference that sails over the room.

    callback: >-
      Perform the task's purpose like Rosé's Mary, Queen of Scots: grand,
      committed, in full accent, to a room that has never heard of her.

  willow_pills_variety_show:
    name: Willow Pill's variety show

    show: Drag Race

    what_happened: >-
      Season 14: Willow Pill's variety show number made her a front-runner, and
      she won the season.

    meaning: >-
      Weird, done brilliantly.

    callback: >-
      Present the finished task as a Willow Pill variety number: strange,
      entirely its own, and it worked.

    when:
      - done

  dejas_lil_jon:
    name: DeJa's Lil Jon

    show: Drag Race

    what_happened: >-
      Season 14 Snatch Game: DeJa Skye won as Lil Jon, earned praise from Lil
      Jon himself, and came away with a catchphrase: "Yay-uh!"

    meaning: >-
      Winning with one word, said with total commitment.

    callback: >-
      Put Lil Jon on the task's sidelines, hyping every step with one word at
      full volume.

  boss_bitch:
    name: Boss Bitch

    show: Drag Race

    what_happened: >-
      Season 15: in the "Boss Bitch" lip sync, Anetra somersaulted over Marcia
      Marcia Marcia as she lay in a backbend, and won. Michelle Visage later
      named it her favorite lip sync of all time.

    meaning: >-
      Athletic perfection under pressure.

    callback: >-
      Mark the finished task's hardest step with Anetra's somersault: over it in
      one clean move, and on to the next count.

    when:
      - done

  the_immunity_potion:
    name: The immunity potion

    show: Drag Race

    what_happened: >-
      Season 16: the two premiere winners each held an immunity potion. Plane
      Jane kept hers for weeks, then gave it to Nymphia Wind in week 10, the
      week RuPaul sent nobody home.

    meaning: >-
      Saving the power for the perfect moment, then spending it on a week that
      didn't need it.

    callback: >-
      Let the slipped task drink the immunity potion it has been saving for
      weeks, then reveal it was spent on a week nobody was going home.

    when:
      - slipped

  nymphias_bananas:
    name: Nymphia's bananas

    show: Drag Race

    what_happened: >-
      Season 16: Nymphia Wind built her drag on bananas and yellow, from her
      entrance to her finale reveal. She beat Sapphira Cristál to "Padam Padam"
      and became the first Taiwanese winner.

    meaning: >-
      Total commitment to one bit.

    callback: >-
      Theme the task the way Nymphia themed a whole season: one color, one
      fruit, every step on brief from the entrance to the finale reveal.

  the_badonka_dunk_tank:
    name: The Badonka Dunk Tank

    show: Drag Race

    what_happened: >-
      Season 17: a lip sync loser could pull one of ten levers, and the right
      one dropped Michelle Visage into a dunk tank and saved her. In four tries
      it saved two queens and sent two home.

    meaning: >-
      The gimmick second chance.

    callback: >-
      Line up ten levers for the slipped task and let it pull one: the right one
      drops Michelle into the tank and saves it, and the other nine don't.

    when:
      - slipped

  onyas_crown_lip_sync:
    name: Onya's crown lip sync

    show: Drag Race

    what_happened: >-
      Season 17 finale: in the lip sync for the crown, to "Abracadabra", Jewels
      Sparkles brought reveals. Onya Nurve brought none, and won.

    meaning: >-
      Winning on the basics alone.

    callback: >-
      Hand the finished task Onya's win: no reveal, no stunt, the song done
      right, and the crown anyway.

    when:
      - done

  myki_ranked_last:
    name: Myki ranked last

    show: Drag Race

    what_happened: >-
      Season 18: in the Rate-A-Queen talent show, the other queens ranked Myki
      Meeks last. She survived the lip sync that followed, then won four
      challenges and the crown.

    meaning: >-
      Counted out by the room, crowned at the end.

    callback: >-
      Open on the big effort ranked last, the way the room ranked Myki, then
      read out what came after, win by win, up to the crown.

    when:
      - big_win

  nini_cocos_streak:
    name: Nini Coco's streak

    show: Drag Race

    what_happened: >-
      Season 18: Nini Coco landed in the bottom two three weeks running and won
      every lip sync. Then she lost the crown to Myki Meeks.

    meaning: >-
      Surviving the bottom over and over.

    callback: >-
      Add the done task to Nini Coco's streak: in the bottom again, won again,
      still standing.

    when:
      - done

  # Drag Race All Stars

  the_she_mergency_button:
    name: The she-mergency button

    show: Drag Race

    what_happened: >-
      All Stars 1 put the queens in teams of two, with a she-mergency button to
      tag in your partner. Yara Sofia hit it to finish a lip sync for Alexis
      Mateo, and the pair went home anyway.

    meaning: >-
      Calling in backup mid-performance.

    callback: >-
      Hover a hand over the she-mergency button this afternoon: tag a partner in
      to finish the task, or remember the pair who pressed it still went home.

    when:
      - afternoon

  dancing_on_my_own:
    name: Dancing on My Own

    show: Drag Race

    what_happened: >-
      All Stars 1: teammates Jujubee and Raven lip synced "Dancing on My Own",
      barely moved, and had the judges in tears. RuPaul sent no one home.

    meaning: >-
      Raw feeling over stunts.

    callback: >-
      Strip the evening's open task of every trick: barely move, mean every
      word, and get to the end of the song.

    when:
      - evening
      - slipped

  shut_up_and_drive:
    name: Shut Up and Drive

    show: Drag Race

    what_happened: >-
      All Stars 2, "Revenge of the Queens": two eliminated queens, Alyssa
      Edwards and Tatianna, lip synced "Shut Up and Drive" for a way back. It
      was so close that both returned.

    meaning: >-
      A tie good enough to bring two queens back.

    callback: >-
      Bring two dropped tasks back onto the list as a pair, lip syncing for the
      same way back, too close for either to go home.

    when:
      - slipped

  ben_eliminates_herself:
    name: Ben eliminates herself

    show: Drag Race

    what_happened: >-
      All Stars 3: the clear front-runner, BenDeLaCreme, won a lip sync, then
      put her own name on the lipstick and went home.

    meaning: >-
      Leaving the party early, while ahead.

    callback: >-
      Catch the task this afternoon at its BenDeLaCreme moment: winning the
      round, and reaching for the lipstick to write its own name.

    when:
      - afternoon

  lifes_not_fair:
    name: Life's not fair

    show: Drag Race

    what_happened: >-
      All Stars 4: Naomi Smalls won the lip sync and sent home Manila Luzon, the
      presumed front-runner. Naomi's unbothered "Life's not fair" became the
      meme.

    meaning: >-
      A shrug at any mild injustice.

    callback: >-
      Shrug at whatever the day did to the task with Naomi's unbothered shrug,
      and move straight on.

  the_same_wig:
    name: The same wig

    show: Drag Race

    what_happened: >-
      All Stars 4 finale: lip syncing "Fighter" against Trinity the Tuck, Monét
      X Change pulled off her wig to reveal the same wig underneath. The two
      were crowned together.

    meaning: >-
      The reveal that reveals nothing, and wins anyway.

    callback: >-
      Stage a big reveal on the task that uncovers exactly what was there
      before, and sell it as hard as Monét sold hers.

  club_96:
    name: Club 96

    show: Drag Race

    what_happened: >-
      All Stars 4: Naomi Smalls and Valentina named their nightclub Club 96 and
      whispered the name over and over. They landed in the bottom, but the
      whisper won the internet.

    meaning: >-
      Two people whispering; the caption for any photo of a whisper.

    callback: >-
      Have the rest of the list lean in and whisper the task's name to each
      other, over and over, like Naomi and Valentina at Club 96.

  kylies_slip:
    name: Kylie's slip

    show: Drag Race

    what_happened: >-
      All Stars 6 finale: in the four-way lip sync for the crown, to "Stupid
      Love", Kylie Sonique Love slipped, nearly fell, kept going, and won the
      season.

    meaning: >-
      A stumble that doesn't stop the show.

    callback: >-
      Fold the done task's stumble into the finish, the way Kylie kept going
      after her slip in the finale.

    when:
      - done

  silkys_barbie_girl:
    name: Silky's Barbie Girl

    show: Drag Race

    what_happened: >-
      All Stars 6: in a RuDemption round, Silky Nutmeg Ganache lip synced
      "Barbie Girl" alone, playing both characters, pulling props from her bra
      and strumming a pizza-box guitar.

    meaning: >-
      Doing both parts at once, by yourself.

    callback: >-
      Play the task as Silky's Barbie Girl, with the user in both roles: the one
      who stalls and the one who gets it done, props pulled from the bra.

  the_spoken_word_lip_sync:
    name: The spoken-word lip sync

    show: Drag Race

    what_happened: >-
      All Stars 7: Monét X Change and Jinkx Monsoon lip synced the franchise's
      first spoken-word number, Julia Sugarbaker's monologue from Designing
      Women. Monét won.

    meaning: >-
      No music, only the words, and someone still wins.

    callback: >-
      Drop the music from the evening's task and deliver it as a monologue:
      every word, no song to hide behind, and someone still wins.

    when:
      - evening

  # Drag Race UK and UK vs the World

  frock_destroyers:
    name: Frock Destroyers

    show: Drag Race

    what_happened: >-
      Drag Race UK, Series 1: Baga Chipz, Blu Hydrangea and Divina de Campo won
      the girl-group challenge as the Frock Destroyers, with "Break Up (Bye
      Bye)". The song reached number 35 on the UK singles chart.

    meaning: >-
      The girl group that outlived its challenge.

    callback: >-
      Form the day's finished tasks into a girl group, each with its verse, and
      give the single a chart position.

    when:
      - done

  uk_hun:
    name: UK Hun?

    show: Drag Race

    what_happened: >-
      Drag Race UK, Series 2: two groups, the United Kingdolls and Bananadrama,
      wrote their own verses to the same song, "UK Hun?". The Kingdolls won, and
      their version reached number 27 on the UK chart.

    meaning: >-
      The same song, done two ways, and everyone ranks them.

    callback: >-
      Perform the task two ways, like the two groups on UK Hun?: the version the
      user planned and the version that happened, then rank them.

  the_lockdown_break:
    name: The lockdown break

    show: Drag Race

    what_happened: >-
