# The references a message can call back to: single moments from the shows and
# from the culture around them.
about: >-
  A reference is one thing fans remember: a moment from Drag Race or Dragula, a
  meme, a feud, an exit, a look, or a piece of the drag and queer culture the
  shows draw on. A motif is a scene that comes back every season; a reference
  happened once. When the job picks a reference for a message, from
  `Dragify-options.yaml`, call back to it in a clause or a line, as if the
  reader already knows the story: `what_happened` is the record, `meaning` is
  what fans use it for, and `callback` is the move that ties it to the task. A
  reference with `when` fits only the occasions it lists.

references:
  # Drag Race, Seasons 1 to 10

  lost_season_filter:
    name: The Season 1 filter

    show: Drag Race

    what_happened: >-
      Season 1 (2009) was shot through a cloudy, soft-focus haze that makes the
      queens hard to make out. Fans call it the lost season, and it re-aired in
      2013 as The Lost Season Ru-Vealed.

    meaning: >-
      Anything that looks better blurred, and the show's early, dated days.

    callback: >-
      Fits a task old enough to have been filmed in 2009: put its plan behind
      the filter, where it reads fine at a distance and falls apart in focus.

  two_piece_and_a_biscuit:
    name: Two piece and a biscuit

    show: Drag Race

    what_happened: >-
      Season 2: Mystique Summers Madison gave her secret to success as a Popeyes
      meal, a two piece and a biscuit.

    meaning: >-
      Comfort food as a strategy: the reward that comes before the work.

    callback: >-
      Fits a task the user is rewarding themselves for before starting it: name
      the meal as the plan, and the task as what's still waiting after the
      biscuit.

  susan_lucci:
    name: The Susan Lucci of the competition

    show: Drag Race

    what_happened: >-
      Season 2: after weeks without a win, RuPaul called Pandora Boxx "the Susan
      Lucci of this competition". Her first time in the bottom sent her home.

    meaning: >-
      The one who's always nearly there and never wins.

    callback: >-
      Fits a task planned again and again that never quite gets done: hand it
      the title, and count its nominations.

  mimi_lifts_india:
    name: Mimi lifts India

    show: Drag Race

    what_happened: >-
      Season 3: lip syncing "Don't Leave Me This Way", Mimi Imfurst picked up
      India Ferrah as she headed for the judges' table and carried her back to
      the stage. Mimi went home.

    meaning: >-
      The lip sync no-no: taking the job literally, and far too hard.

    callback: >-
      Fits a task being handled with much more force than it needs: let the user
      pick it up and carry it across the stage, and remember who went home.

  chads_cher:
    name: Chad's Cher

    show: Drag Race

    what_happened: >-
      Season 4 Snatch Game: Chad Michaels, a professional Cher impersonator,
      played Cher and won. It is still a benchmark for the challenge.

    meaning: >-
      Doing the obvious thing well still wins.

    callback: >-
      Fits a plain task done the plain way: credit it as Cher played by a Cher
      impersonator, with no twist needed.

    when:
      - done

  dida_and_natalie_cole:
    name: DiDa and Natalie Cole

    show: Drag Race

    what_happened: >-
      Season 4: DiDa Ritz lip synced "This Will Be (An Everlasting Love)" with
      Natalie Cole sitting at the judges' table. Out calls it one of the show's
      most powerful moments.

    meaning: >-
      Rising to the occasion with the person who matters watching.

    callback: >-
      Fits a task done in front of the person it's for, like the bill with the
      bank waiting or the gift with its owner in the room: seat that person at
      the judges' table.

  coco_and_alyssa:
    name: Coco and Alyssa

    show: Drag Race

    what_happened: >-
      Season 5: pageant rivals Coco Montrese and Alyssa Edwards feuded from the
      premiere, through "too orange" at Snatch Game. They met in the bottom two
      on "Cold Hearted", and Coco sent Alyssa home.

    meaning: >-
      The rivalry that runs all season and pays off in one lip sync.

    callback: >-
      Fits a task the user has been feuding with for days: cast them as old
      pageant rivals, and set up the bottom two where one of them goes home.

  alyssas_katy_perry:
    name: Alyssa's Katy Perry

    show: Drag Race

    what_happened: >-
      Season 5 Snatch Game: Alyssa Edwards played Katy Perry, now ranked the
      worst Snatch Game of all time. She later gave a strong Joan Crawford on
      All Stars.

    meaning: >-
      Proof that a legend can flop.

    callback: >-
      Fits an easy task fumbled by someone who's usually reliable: file it next
      to Alyssa's Katy Perry, a bad night from a good queen.

    when:
      - slipped

  lil_poundcake:
    name: Lil Poundcake

    show: Drag Race

    what_happened: >-
      Lil Poundcake was a doll from a Season 5 mini challenge. On All Stars 2,
      Alaska tore off a garbage-bag outfit to reveal a pink recreation of it.

    meaning: >-
      The show paying homage to its own jokes.

    callback: >-
      Fits an old task that comes back in a new outfit: rip off the garbage bag
      and show it's the same one from seasons ago.

    when:
      - slipped

  ornacia:
    name: Ornacia

    show: Drag Race

    what_happened: >-
      Season 6 premiere: Vivacious walked into the werk room with a second head
      on top of her own, a styrofoam dome she called Ornacia. Ornacia became a
      legend of its own, and guest judge Ariana Grande wore a replica into the
      Season 15 premiere.

    meaning: >-
      The entrance accessory that became a character.

    callback: >-
      Fits a task whose setup has upstaged it, like the folder made and the
      tools bought: give the accessory its own entrance, with the task still
      underneath it.

    when:
      - morning

  courtney_comes_back:
    name: Courtney comes back

    show: Drag Race

    what_happened: >-
      In 2003, before Drag Race, the Australian Idol judges turned Courtney Act
      down out of drag. She came back the next day as Courtney and got through.

    meaning: >-
      Returning the next day in full drag, and getting through.

    callback: >-
      Fits a task that went badly yesterday: send it back in today in full drag,
      the same task in a better outfit.

    when:
      - slipped

  kennedys_leap:
    name: Kennedy's leap

    show: Drag Race

    what_happened: >-
      Season 7: lip syncing "Roar" against Katya, Kennedy Davenport jumped off
      the stage and hit the splits in front of the judges. Katya went home.

    meaning: >-
      The all-in move that wins the lip sync.

    callback: >-
      Fits a task that needs one committed move to finish: jump off the stage
      into it, splits and all.

  status_update_dead:
    name: Status update, dead

    show: Drag Race

    what_happened: >-
      Season 7, ShakesQueer, an acting challenge nearly every queen bombed:
      Max's "Status update: dead" became the GIF for it.

    meaning: >-
      Anything that died on arrival.

    callback: >-
      Fits a task stalled so long it has flatlined: post its status update.

    when:
      - slipped

  hows_your_head:
    name: How's your head?

    show: Drag Race

    what_happened: >-
      Season 7: RuPaul kept setting up the innuendo for Miss Fame, who missed it
      every time and said her head was fine.

    meaning: >-
      Missing an obvious cue, again and again.

    callback: >-
      Fits a task the user keeps missing every hint about: set up the cue once
      more and let it sail past.

  loaf_of_bread:
    name: The loaf of bread

    show: Drag Race

    what_happened: >-
      Season 7, ShakesQueer: Jasmine Masters came out for the mini challenge
      holding a loaf of bread, and RuPaul asked where she got it. She had packed
      it to make sandwiches.

    meaning: >-
      Turning up with the one thing nobody asked for.

    callback: >-
      Fits a task the user arrives at with all the wrong supplies: let them walk
      on holding the bread, and ask where they got it.

  violets_two_in_one:
    name: Violet's two-in-one

    show: Drag Race

    what_happened: >-
      Season 7 premiere: Violet Chachki's resort look tore away into a second
      look, and she won the challenge. It made her the queen to beat, and she
      went on to win the season.

    meaning: >-
      The double reveal: the fashion queen's flex.

    callback: >-
      Fits a task that turned out to be two, both done: tear away the first and
      show the second underneath.

    when:
      - done

  gingers_tear_away:
    name: Ginger's tear-away

    show: Drag Race

    what_happened: >-
      Season 7, the conjoined-queens episode: lip syncing "I Think We're Alone
      Now" against Sasha Belle, Ginger Minj tore away her costume and ended up
      bare-chested and wigless.

    meaning: >-
      A reveal that goes all the way, past anything planned.

    callback: >-
      Fits a task stripped down to its bare job: tear away the excuses and show
      how little is left underneath.

  the_beyonce_curse:
    name: The Beyoncé curse

    show: Drag Race

    what_happened: >-
      Queens who play Beyoncé in Snatch Game flop, Kenya Michaels on Season 4
      and Asia O'Hara on Season 10 among them, and fans call it a curse. Trinity
      K. Bonet broke it on All Stars 6, in a halftime show.

    meaning: >-
      A known-doomed choice.

    callback: >-
      Fits a plan the user keeps retrying that has never once worked: cast it as
      Beyoncé at Snatch Game, and let the curse do the rest.

  gaga_in_the_werk_room:
    name: Gaga in the werk room

    show: Drag Race

    what_happened: >-
      Season 9 premiere (2017): Lady Gaga walked into the werk room posing as
      one of the queens, her face half hidden by a headpiece, and the cast sized
      her up as an impersonator. Then she revealed herself.

    meaning: >-
      The surprise entrance nobody clocked until the reveal.

    callback: >-
      Fits a task that walks in this morning disguised as something small: let
      it pose as a nobody at its station until it shows its real size.

    when:
      - morning

  sashas_rose_petals:
    name: Sasha's rose petals

    show: Drag Race

    what_happened: >-
      Season 9 finale, the first lip sync for the crown: on "So Emotional"
      against Shea Couleé, Sasha Velour pulled off a glove, then her wig, and
      rose petals poured out of both. She won the crown.

    meaning: >-
      The gold standard reveal, the one every finalist since has chased.

    callback: >-
      Fits a big effort finally finished: the last step is the wig coming off,
      and everything it took pours out as petals.

    when:
      - big_win

  sheas_finale:
    name: Shea's finale

    show: Drag Race

    what_happened: >-
      Season 9: front-runner Shea Couleé, with the most wins of her season, lost
      the first round of the new finale lip sync tournament to Sasha Velour. She
      said later it was not her time.

    meaning: >-
      The front-runner undone by one bad night.

    callback: >-
      Fits a well-planned week knocked over by one day: the record was perfect
      right up to the round that counted.

    when:
      - slipped

  the_all_green_look:
    name: The all-green look

    show: Drag Race

    what_happened: >-
      Season 9: Alexis Michelle walked the runway in all green, a joke about
      Michelle Visage hating the color. Guest judge Tamar Braxton critiqued the
      look straight, and the joke fell flat.

    meaning: >-
      A bit that dies on someone who doesn't know the reference.

    callback: >-
      Fits a task the user is explaining instead of doing: the setup lands only
      if the room has seen the show.

  asias_butterflies:
    name: Asia's butterflies

    show: Drag Race

    what_happened: >-
      Season 10 finale: lip syncing "Nasty" against Kameron Michaels, Asia
      O'Hara released live butterflies from her costume. Too cold to fly, they
      fell and crawled on the stage, and she lost.

    meaning: >-
      The big stunt that flops on live TV.

    callback: >-
      Fits an ambitious plan that landed with a thud: release the butterflies,
      and watch them crawl.

    when:
      - slipped

  monets_fake_split:
    name: Monét's fake split

    show: Drag Race

    what_happened: >-
      Season 10: lip syncing "Pound the Alarm" against Dusty Ray Bottoms, Monét
      X Change faked a split, and won.

    meaning: >-
      The bluff that sells.

    callback: >-
      Fits a task the user is pretending to work on: describe the convincing
      fake split, and the floor it never reached.

  not_next_time:
    name: Not next time

    show: Drag Race

    what_happened: >-
      Season 10 reunion: Asia O'Hara apologized to Miz Cracker for calling her
      "not a star". Miz accepted: "Not next time, bitch."

    meaning: >-
      Forgiveness with a warning attached.

    callback: >-
      Fits a task forgiven for slipping once: accept its apology, and make the
      warning the second half of the sentence.

    when:
      - slipped

  mayhems_eyes:
    name: Mayhem's eyes

    show: Drag Race

    what_happened: >-
      A 2011 club video of Mayhem Miller, years before her Season 10 run, shows
      her opening and closing her eyes to the music. It became the
      #MayhemChallenge in 2018.

    meaning: >-
      The slow, intense look: side-eye with commitment.

    callback: >-
      Fits a task the user keeps glancing at and away from: open and close the
      eyes on it, slowly, to the beat.

  # Drag Race, Seasons 11 to 18

  the_six_way_lip_sync:
    name: The six-way lip sync

    show: Drag Race

    what_happened: >-
      Season 11, "Diva Worship": RuPaul made six queens lip sync at once in
      front of guest judge Troye Sivan. Wigs flew, and Honey Davenport went home
      after leaping off the stage.

    meaning: >-
      Chaos as a format.

    callback: >-
      Fits a day with too many tasks due at once: put them all on the stage
      together and see whose wig flies first.

  sorry_not_sorry:
    name: Sorry Not Sorry

    show: Drag Race

    what_happened: >-
      Season 11: after both bombed Snatch Game, Yvie Oddly and Brooke Lynn Hytes
      lip synced "Sorry Not Sorry", and both stayed. Yvie cartwheeled into a wig
      reveal, and went on to win the season.

    meaning: >-
      Redemption through a lip sync, right after a flop.

    callback: >-
      Fits a task that went badly earlier and got done later: it bombed at
      Snatch Game, then lip synced for its life.

    when:
      - done

  opulence:
    name: Opulence

    show: Drag Race

    what_happened: >-
      Season 11: voguing in a parody challenge, Mercedes Iman Diamond stumbled
      over "opulence, you own everything", a line from Paris Is Burning. Fans
      spell what came out "oppalance".

    meaning: >-
      Fumbling the big line at the big moment.

    callback: >-
      Fits a task where the easiest part went wrong: the grand line, fumbled in
      front of everyone.

    when:
      - slipped

  silky_strips_in_untucked:
    name: Silky strips in Untucked

    show: Drag Race

    what_happened: >-
      Season 11: told she was merely safe, Silky Nutmeg Ganache stripped off her
      outfit in Untucked, ready to lip sync. Yvie Oddly asked what that had to
      do with anything.

    meaning: >-
      Gearing up for a fight nobody called.

    callback: >-
      Fits a user gearing up hard for a small task: strip down for the lip sync,
      then hear the task was safe all along.

  rus_meh:
    name: Ru's meh

    show: Drag Race

    what_happened: >-
      Season 11, the makeover episode: after Nina West and Silky Nutmeg Ganache
      lip synced "No Scrubs", RuPaul's verdict was "meh". Nina later called it
      cutting.

    meaning: >-
      The one-word review that's worse than a read.

    callback: >-
      Fits a task done with no flair at all: one syllable from the host is the
      whole review.

    when:
      - done

  wheres_the_body:
    name: Where's the body?

    show: Drag Race

    what_happened: >-
      Season 11: a three-second clip of A'keria C. Davenport's verse in the
      "Queens Everywhere" challenge song, which fans caption as a grim question
      about a missing body.

    meaning: >-
      Something hidden or lost, asked about darkly.

    callback: >-
      Fits a task that has gone missing from the list: ask where it's buried.

    when:
      - slipped

  jans_face_crack:
    name: Jan's face crack

    show: Drag Race

    what_happened: >-
      Season 12, the Madonna Rusical: Jan expected the win, RuPaul told her she
      was safe, and her smile drained into disbelief on camera. She did it again
      on All Stars 6.

    meaning: >-
      When the result is less than you expected.

    callback: >-
      Fits an ordinary task done that wanted a parade: tell it it's safe, and
      watch the face.

    when:
      - done

  gigis_robot:
    name: Gigi's robot

    show: Drag Race

    what_happened: >-
      Season 12 Snatch Game: RuPaul worried that Gigi Goode's Maria the Robot
      was too robotic. Gigi held her ground and won the challenge.

    meaning: >-
      Backing your own plan against the boss's worry, and being right.

    callback: >-
      Fits a task the user insists on doing their own odd way: let the worry be
      voiced, then let the robot win.

  nicki_detests_it:
    name: Nicki detests it

    show: Drag Race

    what_happened: >-
      Season 12 premiere: guest judge Nicki Minaj told Heidi N Closet she
      detested her hair and makeup, undercutting a strong gown.

    meaning: >-
      The celebrity judge who softens nothing on day one.

    callback: >-
      Fits a task that's mostly right with one glaring flaw: praise the gown,
      then detest the wig.

  the_virtual_finale:
    name: The virtual finale

    show: Drag Race

    what_happened: >-
      Season 12's finale went virtual in the pandemic, with the queens on
      screens from their homes. Jaida Essence Hall was crowned from home.

    meaning: >-
      Winning the whole thing without leaving the house.

    callback: >-
      Fits a task done from the couch: crown it from home, faces on screens.

    when:
      - done

  apolo_lie:
    name: Apolo-lie

    show: Drag Race

    what_happened: >-
      Season 12: Widow Von'Du's word for an apology nobody means.

    meaning: >-
      The fake apology, called out.

    callback: >-
      Fits a task the user has said sorry to and still left undone: name the
      apology for what it is.

    when:
      - slipped

  kandys_boombox:
    name: Kandy's boombox

    show: Drag Race

    what_happened: >-
      Season 13 premiere: lip syncing "Call Me Maybe" against Joey Jay, Kandy
      Muse opened by switching on an imaginary boombox. She won.

    meaning: >-
      An iconic start from nothing.

    callback: >-
      Fits a task started with total confidence and no plan: switch on the
      imaginary boombox and go.

    when:
      - morning

  ru_flips_off_utica:
    name: Ru flips off Utica

    show: Drag Race

    what_happened: >-
      Season 13, the roast: after a joke that went too far, RuPaul gave Utica
      Queen the middle finger on her way out, and fans loved it. Utica
      apologized.

    meaning: >-
      The host giving it right back.

    callback: >-
      Fits a task that keeps answering back with excuses: reply the way Ru
      replied to Utica, with one finger and no words.

  denalis_stare:
    name: Denali's stare

    show: Drag Race

    what_happened: >-
      Season 13 premiere: sent to the Porkchop Loading Dock after losing her lip
      sync, Denali gave the camera a slow, deadpan stare that closed the
      episode.

    meaning: >-
      Silent judgment, sitcom-style.

    callback: >-
      Fits a task that has been sitting there all day: end on a long, flat stare
      at it, straight to camera.

  mary_queen_of_scots:
    name: Mary, Queen of Scots

    show: Drag Race

    what_happened: >-
      Season 13 Snatch Game: Rosé played Mary, Queen of Scots, all beheading
      jokes and a thick accent. In confessional, Kandy Muse said she had no idea
      who Mary, Queen of Scots was.

    meaning: >-
      A reference that sails over the room.

    callback: >-
      Fits a task with a name nobody remembers the reason for: play it grandly
      anyway, to a room that has never heard of it.

  jorgeous_five_lip_syncs:
    name: Jorgeous lip syncs five times

    show: Drag Race

    what_happened: >-
      Season 14: Jorgeous lip synced five times, a first, and survived four of
      them.

    meaning: >-
      The queen who lives in the bottom and keeps winning there.

    callback: >-
      Fits a task that keeps landing in the bottom and keeps surviving: count
      its lip syncs.

    when:
      - slipped

  boss_bitch:
    name: Boss Bitch

    show: Drag Race

    what_happened: >-
      Season 15: in the "Boss Bitch" lip sync, Anetra somersaulted over Marcia
      Marcia Marcia in a martial-arts routine. It is Michelle Visage's favorite
      lip sync of all time.

    meaning: >-
      Athletic perfection under pressure.

    callback: >-
      Fits a hard task done with style: describe the somersault over it.

    when:
      - big_win

  mistress_takes_the_book:
    name: Mistress takes the book

    show: Drag Race

    what_happened: >-
      Season 15, the Wigloose Rusical: Mistress Isabelle Brooks took RuPaul's
      book GuRu from the set, thinking it was a prop. She gave it back when she
      learned it was a producer's, so nobody would search her things and find
      the jewelry, wigs and piece of the werk room wall she had also taken.

    meaning: >-
      Taking everything that isn't bolted down.

    callback: >-
      Fits a task that has picked up other tasks along the way: hand back the
      one thing, and keep quiet about the wall.

  you_know_why:
    name: You know why

    show: Drag Race

    what_happened: >-
      Season 16 premiere: Sapphira Cristál sang a dragged-up "O mio babbino
      caro" while pointing at RuPaul. Asked why, she said, "You know why."

    meaning: >-
      The point made without explaining it.

    callback: >-
      Fits a task everyone knows the reason for: point at it, sing, and decline
      to explain.

  the_immunity_potion:
    name: The immunity potion

    show: Drag Race

    what_happened: >-
      Season 16: the premiere winners each got an immunity potion. Plane Jane
      held hers for weeks and used it on Nymphia Wind in the last week she
      could, a week when nobody went home.

    meaning: >-
      Saving the power for the perfect moment, then spending it on a week that
      didn't need it.

    callback: >-
      Fits a task the user has been saving an excuse for: spend the potion, and
      find out nobody was going home anyway.

  nymphias_bananas:
    name: Nymphia's bananas

    show: Drag Race

    what_happened: >-
      Season 16: Nymphia Wind built her drag on bananas and yellow, from her
      entrance to her finale reveal. She beat Sapphira Cristál to "Padam Padam"
      and became the first Taiwanese winner.

    meaning: >-
      Total commitment to one bit.

    callback: >-
      Fits a user going all in on one task: make everything about it, down to
      the color.

  the_badonka_dunk_tank:
    name: The Badonka Dunk Tank

    show: Drag Race

    what_happened: >-
      Season 17: a lip sync loser could pull one of ten levers, and the right
      one dropped Michelle Visage into a dunk tank and saved her. It saved three
      queens and sent two home, and fans panned it.

    meaning: >-
      The gimmick second chance.

    callback: >-
      Fits a task the user hopes luck will save: pull a lever and see whether
      Michelle gets wet.

    when:
      - slipped

  kori_explains_cabaret:
    name: Kori explains cabaret

    show: Drag Race

    what_happened: >-
      Season 17's Kori King went out ninth and became a fan favorite anyway. In
      a viral September 2025 clip, she explained to the streamer IShowSpeed that
      a cabaret is a venue, not a French dish.

    meaning: >-
      The early exit who won the internet.

    callback: >-
      Fits a task the user doesn't understand yet: explain it patiently, the way
      Kori explained a cabaret to a streamer.

  onyas_crown_lip_sync:
    name: Onya's crown lip sync

    show: Drag Race

    what_happened: >-
      Season 17 finale: Onya Nurve won the lip sync for the crown, to
      "Abracadabra", without a single reveal or stunt.

    meaning: >-
      Winning on the basics alone.

    callback: >-
      Fits a task finished with no tricks at all: nothing torn away, nothing
      thrown, just done.

    when:
      - done

  myki_ranked_last:
    name: Myki ranked last

    show: Drag Race

    what_happened: >-
      Season 18: in the Rate-A-Queen talent show, the other queens ranked Myki
      Meeks last. She went on to win four challenges and the crown.

    meaning: >-
      Counted out on day one, crowned at the end.

    callback: >-
      Fits a big effort on a task everyone had written off: read out its day-one
      ranking, then the crown.

    when:
      - big_win

  nini_cocos_streak:
    name: Nini Coco's streak

    show: Drag Race

    what_happened: >-
      Season 18: Nini Coco landed in the bottom three weeks running and won
      every lip sync, sending home the front-runner among others. Then she lost
      the crown to Myki Meeks.

    meaning: >-
      Surviving the bottom over and over.

    callback: >-
      Fits a task finished at the last minute again: one more week in the
      bottom, one more win, and the streak goes on.

    when:
      - done

  hit_the_slay_button:
    name: Hit the slay button

    show: Drag Race

    what_happened: >-
      The 2021 mobile game RuPaul's Drag Race Superstar has a cartoon RuPaul
      telling the player to hit the slay button. Memes read "slay" as "kill" for
