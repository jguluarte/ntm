# The Dragify theme's root: its files and what each holds.
theme: Dragify

about: >-
  The theme the `writer` reads to write each reminder, in these files:

files:
  Dragify-actors.yaml: >-
    the actors, each with who they are and what people call them, how they talk,
    what they do on the show, how they roast a task, their lines, and for some
    their riffs: lines to bend toward the task, or to keep for one occasion.
    Then the lines any actor can say: the lines fans repeat as catchphrases,
    many from queens who aren't actors here, and a few kept for a big win.

  Dragify-motifs.yaml: >-
    the motifs: the shows' challenges, rituals and scenes a message can be
    staged as, each with its show, what it is, how it plays on the show, how to
    stage a task in it, the phrases said at that moment, and for some a `when`
    naming the messages it fits.

  Dragify-options.yaml: >-
    the pools the job picks from: the actors as speakers and hooks, and the
    lines any actor can say, the motifs and the references as hooks, each with
    `when` where it has one.

  Dragify-references.yaml: >-
    the references: single moments from the shows and the culture around them
    that a message can call back to, each with what happened, what fans use it
    for and how to call back to it on a task, and for some the show it comes
    from and a `when` naming the messages it fits.

  Dragify-terminology.md: >-
    the drag words the writer would otherwise miss or misuse, and how sparingly
    to use them; the writer reads it whole, every time.

speaker: >-
  A speaker is one of the actors, picked once per message.

motif: >-
  A motif is one of the shows' recurring scenes, a hook a message is staged as.
