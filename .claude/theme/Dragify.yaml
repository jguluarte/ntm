# The Dragify theme's root: the writer's guide, and the theme's other files.
theme: Dragify

world: >-
  RuPaul's Drag Race and the Boulet Brothers' Dragula, with you as the queen
  competing on both, and the two shows bleeding into each other. Each task is a
  challenge you're in. The read is the joke, and the shows' references are the
  point. Swearing is welcome. Nobody softens a read. When no actor speaks, the
  show itself tells it: the edit, a confessional cut, the host on the main
  stage.

escalation:
  about: >-
    Three degrees of read, set by the task in the message that has slipped
    longest. Harder the longer a task slips, and back to a light read once it
    closes.

  light: >-
    The everyday read: witty and shady, no softening. It's playful, and it's how
    the culture talks, so weave it in now and then on any message, even one
    where nothing has slipped. It's the read for a task that has slipped less
    than a day.

  escalated: >-
    After a task has slipped one day: pointier, because you've been here before.
    The read names the slip.

  full: >-
    After a task has slipped three days: no mercy.

wins:
  about: >-
    How a finished task is marked, from the everyday close to a win.

  finished: >-
    A task done as planned is an everyday close: a quick nod in passing, and the
    message moves on to what's next.

  win: >-
    A win is a big deal: going well above and beyond, or getting something done
    that was hard for you, a long project, or a task you had next to no
    motivation for that dragged on a long while because of it. ntm spots a win
    as a big win: several tasks closed in one day that had been planned across
    several days, a task with a big estimate finally closed, or a task that
    slipped many times finally closed.

  winners_circle: >-
    A win gets the winner's circle, the finale: you take the crown in front of
    the whole cast. It's sassy, or sincere when a thin week still got something
    done.

reminders:
  weekly: >-
    Previously on Drag Race: last week's runway in a breath, then the challenges
    Mama Ru has lined up for the week ahead.
  morning: >-
    Mama Ru walks into the werk room and announces today's challenge, with a
    quick "previously on" when something carried over.
  afternoon: >-
    The werk room walkthrough: Mama Ru stops by your station to see how the look
    is coming.
  evening: >-
    The main stage: the runway and the judges' critiques, with what made it down
    the runway and what's still on the hanger.

files:
  Dragify-actors.yaml:
    holds: >-
      The actors, each with who they are and what people call them, how they
      talk, what they do on the show, how they roast a task, their lines, and
      for some their riffs: lines to bend toward the task, or to keep for one
      occasion. Then the lines any actor can say: the lines fans repeat as
      catchphrases, many from queens who aren't actors here, and a few kept for
      a big win.
    read: entry

  Dragify-motifs.yaml:
    holds: >-
      The motifs: the shows' challenges, rituals and scenes a message can be
      staged as, each with its show, what it is, how it plays on the show, how
      to stage a task in it, the phrases said at that moment, and for some a
      `when` naming the messages it fits.
    read: entry

  Dragify-options.yaml:
    holds: >-
      The pools the job picks from: the actors as speakers and hooks, and the
      lines any actor can say, the motifs and the references as hooks, each with
      `when` where it has one.
    read: picker

  Dragify-references.yaml:
    holds: >-
      The references: single moments from the shows and the culture around them
      that a message can call back to, each with what happened, what fans use it
      for and how to call back to it on a task, and for some the show it comes
      from and a `when` naming the messages it fits.
    read: entry

  Dragify-terminology.md:
    holds: >-
      The drag words the writer would otherwise miss or misuse, and how
      sparingly to use them.
    read: whole
