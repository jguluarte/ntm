# The Dragify theme's root: its files and what each holds.
theme: Dragify
about: >-
    The theme the `writer` reads to write each reminder, in these files:
files:
    - file: Dragify-actors.yaml
      holds: >-
          the actors, each with who they are and what people call them, how they
          talk, what they do on the show, how they roast a task and their lines.
          Then the lines any actor can say: RuPaul's set phrases, the lines fans
          repeat as catchphrases, mostly from queens who aren't actors here, and
          the Boulet Brothers' shared words for Dragula.
    - file: Dragify-options.yaml
      holds: >-
          what the job picks from for each message, with where each speaker
          appears.
speaker: >-
    A speaker is one of the actors, picked once per message.
