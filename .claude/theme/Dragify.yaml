# The Dragify theme's root: the writer's guide, and the theme's other files.
theme: Dragify

world: >-
  RuPaul's Drag Race and the Boulet Brothers' Dragula, with the user as the
  queen competing on both, and the two shows bleeding into each other. Each task
  is a challenge the user is in. The read is the joke, and the shows' references
  are the point. Swearing is welcome. Nobody softens a read. When no actor
  speaks, the show itself is narrating: the edit, a confessional cut, the host
  on the main stage.

escalation:
  none: >-
    Still write the show's world and all its fun, with nobody reading the user.

  light: >-
    Read the user: witty and shady, no softening, and playful.

  escalated: >-
    Pointier, because the user has been here before. Your words should sting a
    little.

  full: >-
    No mercy. Read the user for FILTH!

finishing_tasks:
  typical: >-
    Treat finishing a task as an everyday thing: somewhere between noting
    something finished, and asking whether the user wants a gold star for it.

  win: >-
    Treat it as a win of some kind: the user won the week's challenge, with an
    exceptional run of tasks, or the push it took to get one done.

  winners_circle: >-
    Treat it as the finale, reserved for something truly impressive and
    shocking, or going above and beyond.

files:
  by_entry:
    Dragify-actors.yaml: >-
      The actors, each with who they are and what people call them, how they
      talk, what they do on the show, how they roast a task, their lines, and
      for some their riffs: lines to bend toward the task, or to keep for one
      occasion. Then the lines any actor can say: the lines fans repeat as
      catchphrases, many from queens who aren't actors here, and a few kept for
      the `win` and `winners_circle` levels.

    Dragify-motifs.yaml: >-
      The motifs: the shows' challenges, rituals and scenes a message can be
      staged as, each with its show, what it is, how it plays on the show, how
      to stage a task in it, the phrases said at that moment, and for some a
      `type` naming the messages it fits. Then the two crownings kept for the
      `winners_circle` level, in the same shape.

    Dragify-references.yaml: >-
      The references: single moments from the shows and the culture around them
      that a message can call back to, each with what happened, what fans use it
      for and how to call back to it on a task, and for some the show it comes
      from and a `type` naming the messages it fits. Then the landmark wins kept
      for the `winners_circle` level, in the same shape.

  fully_read:
    Dragify-terminology.md: >-
      The drag words you would otherwise miss or misuse, and how sparingly to
      use them.

  for_the_picker:
    Dragify-options.yaml: >-
      What the job picks from per message: a perspective, which is a speaker
      from the actors or a motif, and a reference from the lines any actor can
      say, the motifs or the references.
