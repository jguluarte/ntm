# The Dragify theme's root: the writer's guide, and the theme's other files.
theme: Dragify

world: >-
  RuPaul's Drag Race and the Boulet Brothers' Dragula, with you as the queen
  competing on both, and the two shows bleeding into each other. Each task is a
  challenge you're in. The read is the joke, and the shows' references are the
  point. Swearing is welcome. Nobody softens a read. When no actor speaks, the
  show itself is narrating: the edit, a confessional cut, the host on the main
  stage.

escalation:
  none: >-
    A message with no read is still the show's world and all its fun, with
    nobody reading you.

  light: >-
    Witty and shady, no softening, and playful.

  escalated: >-
    Pointier, because you've been here before. Your words should sting a little.

  full: >-
    No mercy. Read them for FILTH!

finishing_tasks:
  typical: >-
    Finishing a task is an everyday thing: somewhere between noting something
    finished, and asking whether you want a gold star for it.

  win: >-
    A win of some kind, and the message treats it as one: you won the week's
    challenge, with an exceptional run of tasks, or the push it took to get one
    done.

  winners_circle: >-
    Reserved for something truly impressive and shocking, or going above and
    beyond: the finale.

files:
  Dragify-actors.yaml:
    holds: >-
      The actors, each with who they are and what people call them, how they
      talk, what they do on the show, how they roast a task, their lines, and
      for some their riffs: lines to bend toward the task, or to keep for one
      occasion. Then the lines any actor can say: the lines fans repeat as
      catchphrases, many from queens who aren't actors here, and a few kept for
      a big win or the winner's circle.
    read: entry

  Dragify-motifs.yaml:
    holds: >-
      The motifs: the shows' challenges, rituals and scenes a message can be
      staged as, each with its show, what it is, how it plays on the show, how
      to stage a task in it, the phrases said at that moment, and for some a
      `when` naming the messages it fits.
    read: entry

  Dragify-options.yaml:
    holds: >-
      The pools the job picks from: the actors as speakers and hooks, and the
      lines any actor can say, the motifs and the references as hooks, each with
      `when` where it has one.
    read: picker

  Dragify-references.yaml:
    holds: >-
      The references: single moments from the shows and the culture around them
      that a message can call back to, each with what happened, what fans use it
      for and how to call back to it on a task, and for some the show it comes
      from and a `when` naming the messages it fits.
    read: entry

  Dragify-terminology.md:
    holds: >-
      The drag words the writer would otherwise miss or misuse, and how
      sparingly to use them.
    read: whole
