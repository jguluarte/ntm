name: Setup
description:
  Install the lint and test tools at devbox.json's versions, and load .env.

runs:
  using: composite
  steps:
    - name: Install jq
      shell: bash
      run: |
        version=$(jq -r '.packages[] | select(test("^jq@"))
            | sub("^jq@"; "")' devbox.json)
        release=https://github.com/jqlang/jq/releases/download/jq-$version
        sudo curl -sSL -o /usr/local/bin/jq "$release/jq-linux-amd64"
        sudo chmod +x /usr/local/bin/jq
    - name: Install prettier and markdownlint-cli2
      shell: bash
      run: >
        npm install --global $(jq -r '.packages[] |
        select(test("^(prettier|markdownlint-cli2)@"))' devbox.json)
    - name: Install bats
      shell: bash
      run: |
        version=$(jq -r '.packages[] | select(test("^bats@"))
            | sub("^bats@"; "")' devbox.json)
        git clone --quiet --depth 1 --branch "v$version" \
            https://github.com/bats-core/bats-core /tmp/bats-core
        sudo /tmp/bats-core/install.sh /usr/local
    - name: Install yamllint
      shell: bash
      run: |
        version=$(jq -r '.packages[] | select(test("^yamllint@"))
            | sub("^yamllint@"; "")' devbox.json)
        pipx install "yamllint==$version"
    - name: Install yq
      shell: bash
      run: |
        version=$(jq -r '.packages[] | select(test("^yq@"))
            | sub("^yq@"; "")' devbox.json)
        pipx install "yq==$version"
    - name: Install shellcheck
      shell: bash
      run: |
        version=$(jq -r '.packages[] | select(test("^shellcheck@"))
            | sub("^shellcheck@"; "")' devbox.json)
        release=https://github.com/koalaman/shellcheck/releases/download
        archive=shellcheck-v$version.linux.x86_64.tar.xz
        curl -sSL "$release/v$version/$archive" | tar -xJ -C /tmp
        sudo mv "/tmp/shellcheck-v$version/shellcheck" /usr/local/bin/
