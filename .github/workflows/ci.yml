name: CI

on:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jetify-com/devbox-install-action@v0.16.0
        with:
          enable-cache: true
      - run: devbox run -- direnv allow .
      - run: devbox run -- direnv exec . make lint

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jetify-com/devbox-install-action@v0.16.0
        with:
          enable-cache: true
      - run: devbox run -- direnv allow .
      - run: devbox run -- direnv exec . make test
