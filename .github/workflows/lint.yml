name: Lint

on:
    pull_request:

jobs:
    lint:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - name: Install prettier and markdownlint, versions from devbox.json
              run: >
                  npm install --global $(jq -r '.packages[] |
                  select(test("^(prettier|markdownlint-cli2)@"))' devbox.json)
            - run: set -a && . ./.env && set +a && make lint
