name: Test

on:
    pull_request:

jobs:
    test:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - name: Install bats, version from devbox.json
              run: >
                  npm install --global $(jq -r '.packages[] |
                  select(test("^bats@"))' devbox.json)
            - run: set -a && . ./.env && set +a && make test
