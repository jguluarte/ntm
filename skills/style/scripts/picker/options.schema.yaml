$schema: https://json-schema.org/draft/2020-12/schema
title: A theme's options file
description: >-
  Written by the theme builder and the recalculation, and read by the picker.
type: object
required: [pools]
properties:
  checksums:
    type: object
    additionalProperties:
      type: string
  speaker_rate:
    type: number
    minimum: 0
    maximum: 1
  pools:
    type: object
    additionalProperties:
      $ref: "#/$defs/pool"

$defs:
  pool:
    type: object
    required: [roles, entries]
    properties:
      file:
        type: string
      roles:
        type: array
        minItems: 1
        items:
          enum: [perspective, reference, speaker]
      entries:
        type: object
        additionalProperties:
          $ref: "#/$defs/entry"

  entry:
    type: [object, "null"]
    properties:
      weight:
        type: number
        minimum: 0
      score:
        type: number
